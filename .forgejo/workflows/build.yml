name: build

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  build:
    runs-on: native
    steps:
      - uses: actions/checkout@v4
      - run: nix build --no-link .#nixosConfigurations.homelab.config.system.build.toplevel
